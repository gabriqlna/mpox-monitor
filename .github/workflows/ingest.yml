name: Atualizar dados

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run ingest
        env:
          DATA_MODE: live
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
